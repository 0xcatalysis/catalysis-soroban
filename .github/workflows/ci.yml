name: CI

# The same checks run locally with scripts/check.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, lint and build Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # soroban-sdk 28 refuses a plain `cargo build` for contracts; it must be
      # built through the Stellar CLI, which also strips the spec.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.0.0

      - name: Build contracts (wasm32v1-none)
        run: stellar contract build

      - name: Contract sizes
        run: ls -l target/wasm32v1-none/release/*.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
