[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/cover_pool",
    "contracts/covered_vault",
    "contracts/mock_strategy",
    "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/0xcatalysis/catalysis-soroban"
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0"
catalysis-common = { path = "contracts/common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
