<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d5bc4"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d63"/></marker>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f6fd8"/><stop offset="1" stop-color="#6a8ae6"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1430" flood-opacity=".14"/></filter>
  </defs>
  <style>
    .box{fill:#fff;stroke:#c9d4f5;stroke-width:1.5}
    .t{font-size:17px;font-weight:700;fill:#0b1430}
    .s{font-size:12.5px;fill:#55659a}
    .hi .t{fill:#fff}.hi .s{fill:#e6ecff}
    .lbl{font-size:12.5px;fill:#3d5bc4;font-weight:600}
    .lblg{font-size:12.5px;fill:#1f9d63;font-weight:700}
    .wire{fill:none;stroke:#3d5bc4;stroke-width:2}
    .wireg{fill:none;stroke:#1f9d63;stroke-width:2.5}
    .badge{fill:#0b1430}.badget{font-size:11px;font-weight:700;fill:#fff}
  </style>

  <!-- boundary -->
  <rect x="12" y="12" width="936" height="536" rx="18" fill="#f6f8ff" stroke="#dfe6fb" stroke-width="1.5"/>
  <text x="36" y="42" font-size="12" font-weight="700" fill="#8fa6ee" letter-spacing="2.5">STELLAR / SOROBAN — EVERYTHING IN THE PAYOUT PATH STAYS ON THE LEDGER</text>

  <!-- Depositor -->
  <g filter="url(#sh)"><rect class="box" x="48" y="120" width="190" height="78" rx="12"/></g>
  <text class="t" x="68" y="152">Depositor</text>
  <text class="s" x="68" y="176">puts XLM in · paid in full</text>

  <!-- CoveredVault -->
  <g filter="url(#sh)"><rect x="400" y="100" width="280" height="118" rx="14" fill="url(#hi)"/></g>
  <g class="hi">
    <text class="t" x="424" y="138">CoveredVault</text>
    <text class="s" x="424" y="162">shares · per-depositor principal</text>
    <text class="s" x="424" y="182">idle XLM · whitelisted strategies</text>
    <text class="s" x="424" y="202">values positions from its own books</text>
  </g>
  <circle class="badge" cx="660" cy="118" r="11"/><text class="badget" x="660" y="122" text-anchor="middle">2</text>

  <!-- Strategies -->
  <g filter="url(#sh)"><rect class="box" x="48" y="330" width="150" height="76" rx="12"/></g>
  <text class="t" x="66" y="360">Strategy A</text><text class="s" x="66" y="382">Blend market</text>
  <g filter="url(#sh)"><rect class="box" x="218" y="330" width="150" height="76" rx="12"/></g>
  <text class="t" x="236" y="360">Strategy B</text><text class="s" x="236" y="382">Blend market</text>
  <text class="s" x="48" y="438">test and demo: MockStrategy · milestone 1: Blend V2 strategy</text>

  <!-- CoverPool -->
  <g filter="url(#sh)"><rect x="400" y="320" width="280" height="110" rx="14" fill="url(#hi)"/></g>
  <g class="hi">
    <text class="t" x="424" y="358">CoverPool</text>
    <text class="s" x="424" y="382">staked XLM · shares · premium index</text>
    <text class="s" x="424" y="402">cover written ≤ capital, always</text>
  </g>
  <circle class="badge" cx="660" cy="338" r="11"/><text class="badget" x="660" y="342" text-anchor="middle">1</text>

  <!-- Stakers -->
  <g filter="url(#sh)"><rect class="box" x="760" y="336" width="170" height="78" rx="12"/></g>
  <text class="t" x="778" y="368">Stakers</text>
  <text class="s" x="778" y="392">XLM · earn premium</text>

  <!-- Curator -->
  <g filter="url(#sh)"><rect class="box" x="760" y="120" width="170" height="78" rx="12"/></g>
  <text class="t" x="778" y="152">Curator</text>
  <text class="s" x="778" y="176">allocates · buys cover</text>

  <!-- wires -->
  <!-- depositor <-> vault -->
  <path class="wire" d="M238 159 H392" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text class="lbl" x="315" y="148" text-anchor="middle">deposit · withdraw</text>
  <!-- curator -> vault -->
  <path class="wire" d="M760 159 H688" marker-end="url(#ar)"/>
  <text class="lbl" x="724" y="148" text-anchor="middle">operates</text>
  <!-- vault -> strategies (allocate) -->
  <path class="wire" d="M420 218 V270 H123 V322" marker-end="url(#ar)"/>
  <path class="wire" d="M293 270 V322" marker-end="url(#ar)"/>
  <text class="lbl" x="208" y="262" text-anchor="middle">allocate · withdraw liquidity</text>
  <!-- vault -> pool (buy cover) -->
  <path class="wire" d="M470 218 V312" marker-end="url(#ar)"/>
  <text class="lbl" x="482" y="254">buy_cover</text>
  <text class="lbl" x="482" y="270">premium → stakers</text>
  <!-- pool -> vault (claim) -->
  <path class="wireg" d="M620 320 V226" marker-end="url(#arg)"/>
  <text class="lblg" x="632" y="254">claim shortfall</text>
  <text class="lblg" x="632" y="270">inside the withdrawal</text>
  <!-- stakers <-> pool -->
  <path class="wire" d="M760 375 H688" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text class="lbl" x="720" y="364" text-anchor="middle">stake</text><text class="lbl" x="720" y="394" text-anchor="middle">unstake</text>
  <text class="s" x="845" y="440" text-anchor="middle">slashed pro rata on a claim,</text>
  <text class="s" x="845" y="456" text-anchor="middle">through the share value</text>

  <!-- footer -->
  <rect x="36" y="478" width="888" height="46" rx="10" fill="#eaf0ff"/>
  <text x="480" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1430">The trigger is automatic. No oracle, no claims committee.</text><text x="480" y="515" text-anchor="middle" font-size="13" fill="#55659a">A strategy loss lowers NAV, the vault's own books say what each depositor is short, and the pool pays it in the same transaction.</text>
</svg>
