<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa6ee"/></marker>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f6fd8"/><stop offset="1" stop-color="#6a8ae6"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1430" flood-opacity=".14"/></filter>
  </defs>
  <style>
    .step{fill:#fff;stroke:#c9d4f5;stroke-width:1.5}
    .n{font-size:11px;font-weight:700;fill:#8fa6ee;letter-spacing:1.5}
    .t{font-size:15px;font-weight:700;fill:#0b1430}
    .f{font-size:12px;fill:#55659a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .fw{fill:#fff !important}
    .ex{font-size:13px;fill:#1f9d63;font-weight:700}
    .exl{font-size:12px;fill:#55659a}
    .wire{fill:none;stroke:#8fa6ee;stroke-width:2}
  </style>

  <!-- one-transaction bracket -->
  <path d="M40 40 V28 H920 V40" fill="none" stroke="#9fb6ff" stroke-width="2"/>
  <rect x="384" y="16" width="192" height="24" rx="12" fill="#eaf0ff"/>
  <text x="480" y="33" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d5bc4" letter-spacing="1.5">ONE TRANSACTION: withdraw()</text>

  <!-- steps -->
  <g filter="url(#sh)"><rect class="step" x="40" y="70" width="156" height="118" rx="12"/></g>
  <text class="n" x="56" y="94">STEP 1</text>
  <text class="t" x="56" y="116">Value the shares</text>
  <text class="f" x="56" y="140">value = shares</text>
  <text class="f" x="56" y="156">  × nav / total</text>
  <text class="f" x="56" y="172">(rounds down)</text>

  <g filter="url(#sh)"><rect class="step" x="222" y="70" width="156" height="118" rx="12"/></g>
  <text class="n" x="238" y="94">STEP 2</text>
  <text class="t" x="238" y="116">Pull liquidity</text>
  <text class="f" x="238" y="140">idle first, then</text>
  <text class="f" x="238" y="156">strategies in</text>
  <text class="f" x="238" y="172">whitelist order</text>

  <g filter="url(#sh)"><rect x="404" y="70" width="156" height="118" rx="12" fill="url(#hi)"/></g>
  <text class="n fw" x="420" y="94" style="fill:#dbe4ff">STEP 3</text>
  <text class="t" x="420" y="116" fill="#fff">Claim the shortfall</text>
  <text class="f fw" x="420" y="140">shortfall =</text>
  <text class="f fw" x="420" y="156"> max(protected</text>
  <text class="f fw" x="420" y="172">   − value, 0)</text>

  <g filter="url(#sh)"><rect class="step" x="586" y="70" width="156" height="118" rx="12"/></g>
  <text class="n" x="602" y="94">STEP 4</text>
  <text class="t" x="602" y="116">Update the books</text>
  <text class="f" x="602" y="140">burn shares</text>
  <text class="f" x="602" y="156">reduce principal</text>
  <text class="f" x="602" y="172">pro rata</text>

  <g filter="url(#sh)"><rect class="step" x="768" y="70" width="156" height="118" rx="12"/></g>
  <text class="n" x="784" y="94">STEP 5</text>
  <text class="t" x="784" y="116">Pay the depositor</text>
  <text class="f" x="784" y="140">paid = value</text>
  <text class="f" x="784" y="156">     + claimable</text>
  <text class="f" x="784" y="172">in full</text>

  <path class="wire" d="M196 129 H214" marker-end="url(#ar)"/>
  <path class="wire" d="M378 129 H396" marker-end="url(#ar)"/>
  <path class="wire" d="M560 129 H578" marker-end="url(#ar)"/>
  <path class="wire" d="M742 129 H760" marker-end="url(#ar)"/>

  <!-- source annotations -->
  <text class="exl" x="300" y="214" text-anchor="middle">from idle, then strategies</text>
  <text class="exl" x="482" y="208" text-anchor="middle">from the CoverPool</text><text class="exl" x="482" y="224" text-anchor="middle">stakers slashed pro rata</text>

  <!-- worked example strip -->
  <rect x="40" y="236" width="884" height="70" rx="12" fill="#f6f8ff" stroke="#dfe6fb"/>
  <text x="56" y="260" font-size="11" font-weight="700" fill="#8fa6ee" letter-spacing="2">WORKED EXAMPLE (5.3) · user deposited 100, Market B lost 20% of its 50</text>
  <text class="ex" x="118" y="290" text-anchor="middle">value 90</text>
  <text class="ex" x="300" y="290" text-anchor="middle">90 pulled</text>
  <text class="ex" x="482" y="290" text-anchor="middle">10 claimed from the pool</text>
  <text class="ex" x="664" y="290" text-anchor="middle">principal 100 → 0</text>
  <text class="ex" x="846" y="290" text-anchor="middle">user receives 100</text>
</svg>
